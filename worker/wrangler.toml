name = "trinity-os-sync"
main = "src/index.ts"
compatibility_date = "2026-08-24"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "DB"
database_name = "trinity-os-db"
database_id = "e6b6cdaa-bbce-437d-8074-a7248bbc4b4f"

[vars]
ALLOWED_ORIGIN = "https://trinityos.mcv.kr"
ENVIRONMENT = "production"
SESSION_TTL_DAYS = "7"
AI_PROVIDER = "nvidia-kimi"
NVIDIA_MODEL = "openai/gpt-oss-20b"
AI_TIMEOUT_MS = "25000"
AI_MAX_RETRIES = "0"
AI_USER_DAILY_LIMIT = "12"
AI_GLOBAL_DAILY_LIMIT = "100"
AI_CHAT_COOLDOWN_SECONDS = "8"
# Set AI_DEBUG = "true" only in the development Worker environment.
